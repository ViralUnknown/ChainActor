<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf2;
      padding: 16px;
    }
    h2 {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 14px;
    }
    label {
      font-size: 12px;
      color: #8b949e;
      display: block;
      margin-bottom: 5px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf2;
      font-size: 13px;
      padding: 8px;
      resize: vertical;
      outline: none;
      font-family: monospace;
    }
    textarea:focus { border-color: #58a6ff; }
    .hint {
      font-size: 11px;
      color: #6e7681;
      margin-top: 5px;
      margin-bottom: 12px;
    }
    .status-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      margin-bottom: 12px;
      min-height: 40px;
      display: none;
    }
    .status-box.visible { display: block; }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #21262d;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-fill {
      height: 100%;
      background: #3fb950;
      width: 0%;
      transition: width 0.3s ease;
    }
    .count-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .count-pill {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 4px 12px;
      color: #8b949e;
    }
    .count-pill strong { color: #3fb950; }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 7px;
    }
    .btn-start { background: #238636; color: #fff; }
    .btn-start:hover { background: #1a7f37; }
    .btn-start:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-stop { background: #21262d; color: #cdd9e5; border: 1px solid #30363d; }
    .btn-stop:hover { background: #30363d; }
    .btn-stop:disabled { opacity: 0.4; cursor: not-allowed; }
    .footer { font-size: 11px; color: #484f58; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>

  <h2>✅ X Bulk Unblocker</h2>
  <p class="subtitle">Paste usernames → Start → Close popup (keeps running)</p>

  <label for="usernameInput">Usernames (one per line)</label>
  <textarea id="usernameInput" placeholder="@user1&#10;user2&#10;@user3"></textarea>
  <p class="hint">Optional @. Duplicates ignored. Runs in background.</p>

  <div id="statusBox" class="status-box">
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <div id="statusText">Ready to unblock.</div>
  </div>

  <div class="count-row" id="countRow" style="display:none;">
    <div class="count-pill">Total: <strong id="totalCount">0</strong></div>
    <div class="count-pill">Unblocked: <strong id="unblockedCount">0</strong></div>
    <div class="count-pill">Skipped: <strong id="skippedCount">0</strong></div>
  </div>

  <button id="startBtn" class="btn btn-start">✅ Start Unblocking</button>
  <button id="stopBtn" class="btn btn-stop" disabled>⏹ Stop</button>

  <p class="footer">Logged into X? Auto-closes tabs after each user.</p>

  <script src="popup.js"></script>
</body>
</html>
